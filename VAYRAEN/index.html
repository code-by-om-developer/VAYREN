<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAYREN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Announcement Bar -->
    <div class="announcement">
        COMPLIMENTARY SHIPPING ON ORDERS OVER $100
    </div>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="index.html" class="logo">
            VAYREN
        </a>

        <nav class="nav-links">
            <a href="shop.html">SHOP</a>
            <a href="shop.html">COLLECTIONS</a>
            <a href="shop.html">NEW ARRIVALS</a>
        </nav>

        <!-- Navbar Icons and Sign In -->
        <div class="nav-actions">
            <a href="shop.html" class="icon-link" aria-label="Search">
                <img src="assets/icons/search.svg" alt="">
            </a>

            <a href="signin.html" class="icon-link" aria-label="Account">
                <img src="assets/icons/account.svg" alt="">
            </a>

            <a href="signin.html" class="signin">SIGN IN</a>


            <a href="cart.html" class="icon-link bag" aria-label="Shopping bag">
                <img src="assets/icons/bag.svg" alt="">
                <span>0</span>
            </a>

            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <img src="assets/icons/menu.svg" alt="">
            </button>
        </div>

    </header>
    <!-- Hero Section -->
    <main>
        <section class="hero">
            <!-- Hero Content -->
            <div class="hero-content">
                <p class="hero-label">
                    THE NEW COLLECTION
                </p>

                <h1>
                    BEYOND THE ORDINARY.
                </h1>

                <p class="hero-description">
                    Discover timeless essentials
                    designed for modern living.
                </p>

                <a href="shop.html" class="hero-btn">
                    EXPLORE COLLECTION
                    <span aria-hidden="true">↗</span>
                </a>
            </div>

            <!-- Fashion Video -->
            <div class="hero-visual">
                <video width="300" class="hero-video" autoplay muted controls loop playsinline preload="auto"
                    poster="assets/images/hero-poster.jpg">
                    <source src="assets/images/vayren-hero2.mp4" type="video/mp4">
                    Your browser does not support HTML video.
                </video>

                <p class="hero-caption">
                    VAYREN - COLLETION 01
                </p>
            </div>
        </section>
    </main>


    <script src="script.js"></script>
</body>

</html>
